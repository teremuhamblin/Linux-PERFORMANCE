# logging.conf — Linux-PERFORMANCE

LOG_ROOT="/var/log/linux-performance"

LOG_MODULE_SYSTEM="$LOG_ROOT/system.log"
LOG_MODULE_ENV="$LOG_ROOT/environment.log"
LOG_MODULE_CINNAMON="$LOG_ROOT/cinnamon.log"
LOG_MODULE_TOOLS="$LOG_ROOT/tools.log"

LOG_FORMAT="[%Y-%m-%d %H:%M:%S] [LEVEL] MESSAGE"
LOG_ROTATION="weekly"
LOG_MAX_SIZE="10M"
