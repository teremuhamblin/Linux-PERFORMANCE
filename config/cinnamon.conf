# cinnamon.conf — Linux-PERFORMANCE
# Personnalisation Cinnamon

CINNAMON_THEME="Mint-Y-Dark"
CINNAMON_ICONS="Mint-Y-Dark"
CINNAMON_CURSOR="DMZ-White"

# Applets recommandés
CINNAMON_APPLETS=(
  "cpu-monitor@cinnamon.org"
  "network@cinnamon.org"
  "calendar@cinnamon.org"
)

# Desklets recommandés
CINNAMON_DESKLETS=(
  "clock@cinnamon.org"
)

# Extensions
CINNAMON_EXTENSIONS=(
  "transparent-panels@linux-performance"
)
