# system.conf — Linux-PERFORMANCE
# Configuration système globale

SYSTEM_NAME="linux-performance"
SYSTEM_VERSION="1.0"

# Optimisations kernel
KERNEL_SCHEDULER="performance"
KERNEL_SWAPPINESS=10
KERNEL_DIRTY_RATIO=5
KERNEL_DIRTY_BG_RATIO=2

# Services à désactiver
DISABLE_SERVICES=(
  "bluetooth"
  "cups"
  "avahi-daemon"
)

# Services à activer
ENABLE_SERVICES=(
  "cron"
  "systemd-timesyncd"
)

# Logs
LOG_LEVEL="INFO"
LOG_PATH="/var/log/linux-performance"
