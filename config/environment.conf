# environment.conf — Linux-PERFORMANCE
# Environnement d’ingénierie

ENV_NAME="performance-core"
ENV_VERSION="1.0"

# Chemins
PERF_HOME="/opt/performance"
PERF_BIN="$PERF_HOME/bin"
PERF_LIB="$PERF_HOME/lib"

export PATH="$PERF_BIN:$PATH"
export LD_LIBRARY_PATH="$PERF_LIB:$LD_LIBRARY_PATH"

# Variables d’ingénierie
export PERFORMANCE_MODE="true"
export PERFORMANCE_LOG="/var/log/linux-performance/environment.log"
